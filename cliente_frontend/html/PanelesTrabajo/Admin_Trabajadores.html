<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Trbajadores - Sincrostock</title>
    <link rel="stylesheet" href="/css/estilo_base.css">
</head>
<body>

<nav>
    <h2>Trabajadores - Sincrostock</h2>
    <hr>
    <ul>
        <li onclick="location.href='Direccion.html'" > Inicio</li>
        <li onclick="location.href='Admin_Trabajadores.html'" >Trabajadores</li>
        <li onclick="location.href='Admin_Articulos.html'" >Artículos</li>
        <li onclick="location.href='Admin_Clientes.html'" >Clientes</li>
        
    </ul>
    <button class="btn btn-logout" onclick="logout()">Cerrar Sesión</button>
</nav>

<main>
    <div class="card">
        <h1>Gestión de Trabajadores</h1>
        <h2> Puedes crear, editar, borrar y ver trabajadores.</h2>

        <form class="form">
		    <input type="hidden" id="usuario-id"> 
		    
				<div class ="conjunto">
		        <label>Username:</label>
		        <input type="text" id="username" placeholder="Username" required>
		  		</div>
				<div class ="conjunto">
		        <label>Nombre:</label>
		        <input type="text" id="nombre-real" placeholder="Nombre">
				</div>
				<div class ="conjunto">
		        <label>Apellidos:</label>
		        <input type="text" id="apellidos" placeholder="Apellidos">
				</div>
				<div class ="conjunto">
		        <label>Contraseña:</label>
		        <input type="password" id="password" placeholder="Password">
				</div>
		
		    <div>
		        <label> Roles:</label>
		        <div id="lista-checkboxes">
		            Cargando roles...
		        </div>
		    </div>
		   
		    <button type="submit" class="btn btn-add" id="btn-submit" >Guardar Trabajador</button>
		    <button type="button" class="btn" id="btn-cancelar" style="display:none" onclick="resetForm()">Cancelar</button>	
		</form>
		
        <table>
            <thead>
				    <tr>
				        <th>Username</th>
				        <th>Nombre</th>
				        <th>Apellido</th> <th>Password</th>
				        <th>Rol</th>
				        <th>Acciones</th> 
				    </tr>
				</thead>
            <tbody id="tabla-usuarios">
                <tr><td colspan="5">Cargando trabajadores...</td></tr>
            </tbody>
        </table>
    </div>
</main>


  
   <script src="/js/admin_trabajadores.js"></script> 
</body>
</html>
