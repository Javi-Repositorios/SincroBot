<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SincroStock Chatbot</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --card-bg: #2b2b3b;
            --text-color: #e0e0e0;
            --user-msg: #2563eb;
            --bot-msg: #374151;
            --accent: #3b82f6;
            --border: #44445a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 80vh;
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .chat-header {
            padding: 15px;
            background-color: #181825;
            border-bottom: 1px solid var(--border);
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 8px;
            line-height: 1.4;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg);
            color: #ffffff;
        }

        .message.bot {
            align-self: flex-start;
            background-color: var(--bot-msg);
            color: var(--text-color);
        }

        .message.system {
            align-self: center;
            font-size: 0.85rem;
            color: #888;
            font-style: italic;
        }

        .chat-input-area {
            display: flex;
            padding: 12px;
            background-color: #181825;
            border-top: 1px solid var(--border);
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background-color: var(--bg-color);
            color: var(--text-color);
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent);
        }

        button {
            padding: 10px 18px;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            Asistente de Inventario - SincroStock
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message system">Conectado con el servidor. Haz tu consulta sobre el stock.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Escribe un mensaje..." autocomplete="off">
            <button id="sendBtn" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // Permite enviar mensaje al presionar la tecla Enter
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Renderiza el mensaje del usuario
            appendMessage(text, 'user');
            userInput.value = '';
            setLoading(true);

            // Crea un mensaje de carga para el bot
            const loadingMsgDiv = appendMessage('Consultando...', 'bot');

            try {
                // Peticion HTTP POST al backend a traves del proxy NGINX (/api/chat)
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: text
                });

                if (!response.ok) {
                    throw new Error(`Error en el servidor: ${response.status}`);
                }

                const data = await response.text();
                loadingMsgDiv.textContent = data;
            } catch (error) {
                loadingMsgDiv.textContent = 'Error al comunicarse con el servidor.';
                console.error('Fetch Error:', error);
            } finally {
                setLoading(false);
                scrollToBottom();
            }
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            scrollToBottom();
            return msgDiv;
        }

        function setLoading(state) {
            userInput.disabled = state;
            sendBtn.disabled = state;
        }

        function scrollToBottom() {
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
