<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Articulos - Sincrostock</title>
    <link rel="stylesheet" href="/css/estilo_base.css">
</head>
<body>

<nav>
    <h2>Articulos - Sincrostock</h2>
    <hr>
    <ul >
        <li onclick="location.href='Direccion.html'" > Inicio</li>
        <li onclick="location.href='Admin_Trabajadores.html'" >Trabajadores</li>
        <li onclick="location.href='Admin_Articulos.html'" >Artículos</li>
        <li onclick="location.href='Admin_Clientes.html'" >Clientes</li>
        
    </ul>
    <button class="btn btn-logout" onclick="logout()">Cerrar Sesión</button>
</nav>
<main>
    <div class="card">
        <h1>Gestión de Artículos</h1>
        <h2>Puedes crear, editar, borrar y ver articulos.</h2>

        <form class="form">
                <input type="hidden" id="articulo-id">
				<div class ="conjunto"> 
                <label>Nombre:</label>
                <input type="text" id="nombre" placeholder="Nombre del artículo" required>
     			</div>
				<div class ="conjunto">
                <label>Stock:</label>
                <input type="number" id="stock" placeholder="0" required>
				</div>
				<div class ="conjunto">
                <label>Precio:</label>
                <input type="number" step="0.01" id="precio" placeholder="0.00" required>
				</div>
				<div class ="conjunto">
				<button type="submit" class="btn btn-add" id="btn-submit">Guardar Artículo</button>
				<button type="button" class="btn" id="btn-cancelar" style="display:none" onclick="resetForm()">Cancelar</button>
				</div>		
        </form>
		



        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Stock</th> 
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-articulos">
                <tr><td colspan="5">Cargando artículos...</td></tr>
            </tbody>
        </table>
    </div>
</main>

<script src="/js/admin_articulos.js"></script> 
</body>
</html>
