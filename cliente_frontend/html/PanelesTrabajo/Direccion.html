<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - Dirección</title>
   <!--
    <script src="js/validaRolDirector.js"></script>
    -->
    <link rel="stylesheet" href="/css/estilo_base.css">
    <style>
       
    </style>
</head>
<body>

<nav>
    <h2>Direccion - Sincrostock</h2>
    <hr>
    <ul >
        <li onclick="location.href='Direccion.html'">Inicio</li>
        <li onclick="location.href='Admin_Trabajadores.html'">Trabajadores</li>
        <li onclick="location.href='Admin_Articulos.html'">Artículos</li>
        <li onclick="location.href='Admin_Clientes.html'">Clientes</li>
		<li onclick="location.href='Chat.html'">Chat</li>
    </ul>
    <button class="btn btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
</nav>

<main>
    <div class="card">
        <h1>Estadísticas Globales</h1>

        <div class="estadisticas_div">
            <div class="stat-card">
                <h3>ARTICULO MÁS VENDIDO</h3>
                <p id="txt-articulo-top" class="highlight">Cargando...</p>
            </div>
            <div class="stat-card">
                <h3>MEJOR VENDEDOR</h3>
                <p id="txt-vendedor-top" class="highlight">Cargando...</p>
            </div>
        </div>

        <hr>

        <h2>Historial Completo de Pedidos</h2>
          <div class="form" >
				    <input type="text" class="filtro" placeholder="Filtrar por vendedor..." onkeyup="filtrarPedidos()">
				    <input type="text" class="filtro" placeholder="Filtrar por cliente..." onkeyup="filtrarPedidos()">
				    <input type="date" class="filtro" onchange="filtrarPedidos()">
				    <button class="filtro" onclick="limpiarFiltros()">Limpiar</button>
				</div>
   
   
      

        <table class="tabla-acordeon">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Fecha</th>
                    <th>Vendedor</th>
                    <th>Cliente</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody id="tabla-pedidos-body">
                </tbody>
        </table>
    </div>

    </div>
</main>

<script src="/js/direccion.js"></script>
</body>
</html>
