<html>

<head>
    <title>Panel de Clientes</title>
    <meta charset="utf-8" />
    <script src="../../js/validaRolDirector.js"></script>
    <script src="../../js/admin_clientes.js"></script>
    <link rel="stylesheet" href="../../css/estilo_base.css">
</head>
<body>

<nav>
    <h2>Clientes - Sincrostock</h2>
    <hr>
    <ul >
        <li onclick="location.href='Direccion.html' "> Inicio</li>
        <li onclick="location.href='Admin_Trabajadores.html'">Trabajadores</li>
        <li onclick="location.href='Admin_Articulos.html'" >Artículos</li>
        <li onclick="location.href='Admin_Clientes.html'" >Clientes</li>
		<li onclick="location.href='Chat.html'">Chat</li>
       
    </ul>
    <button class="btn btn-logout" onclick="logout()">Cerrar Sesión</button>
</nav>



<main>
    <div class="card">
        <h1>Gestión de Clientes</h1>
        <h2>Puedes crear, editar, borrar y ver Clientes.</h2>

       <form class="form">
			<div class ="conjunto">
			<label>Nif:</label>
		    <input type="text" id="nif" name="nif" required pattern="[0-9]{8}[A-Z]" maxlength="9"  title="El NIF debe tener 8 números y una letra mayúscula (ej: 12345678Z)">
			</div>
			<div class ="conjunto">
			<label>Nombre:</label>
		    <input type="text" id="nombre" name="nombre" required maxlength="100">
			</div>
			<div class ="conjunto">
			<label>Email:</label>
		    <input type="email" id="email" name="email" required maxlength="100">
			</div>
			<div class ="conjunto">
			<label>Telefono:</label>
		    <input type="tel" id="telefono" name="telefono" required maxlength="15">
			</div>
			<div class ="conjunto">
			<button type="submit" id="btn-submit"  class="btn btn-add">Guardar Cliente</button>
			<button type="button" class="btn" id="btn-cancelar" style="display:none" onclick="resetForm()">Cancelar</button>	
			</div>
		</form>
		

        <table>
            <thead>
                <tr>
                    <th>Nif</th>
                    <th>Nombre</th> 
                    <th>Email</th>
                    <th>Telefono</th>
					<th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-clientes">
                <tr><td colspan="5">Cargando clientes...</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
