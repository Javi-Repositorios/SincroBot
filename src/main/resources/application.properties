spring.application.name=SincroStock

# Conexion a Postgres
spring.datasource.url=jdbc:postgresql://db:5432/sincrostock
spring.datasource.username=admin
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de Hibernate JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuracion de encriptacion del token
app.jwt.secret=tu_clave_secreta_super_larga_de_al_menos_32_caracteres_123456
app.jwt.expiration-ms=86400000


# ==========================================
# CONFIGURACION DE SPRING AI Y CHATBOT (OLLAMA LOCAL)
# ==========================================

# 1. Activaci�n del modelo y conexi�n con Ollama
spring.ai.model.chat=ollama
spring.ai.ollama.base-url=http://host.docker.internal:11434
spring.ai.ollama.chat.options.model=gemma4:latest
spring.ai.ollama.chat.options.temperature=0.7
# Nombre del modelo de embeddings activo en Ollama
spring.ai.ollama.embedding.options.model=nomic-embed-text


# 2. Configuraci�n de la base de datos de vectores (PGvector)
# NOTA: Las dimensiones deben coincidir con el modelo de embeddings que uses.
# Si usas Llama 3 para embeddings, las dimensiones suelen ser diferentes a 1536 (OpenAI).
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.initialize-schema=true


spring.ai.chat.memory.repository.jdbc.initialize-schema=never
# 3. Configuracion para el Streaming de datos
spring.mvc.async.request-timeout=-1